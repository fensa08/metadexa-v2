name: Validate docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate build
        run: npx --yes mint validate
      - name: Check broken links
        run: npx --yes mint broken-links
